description: |-
  Internal Server Error. An unexpected internal error has occurred in the server.

  The body shape differs by the service backing the endpoint. Each example below is labelled
  with the endpoint group that returns it. None are wrapped in a `data` array.
content:
  application/json:
    schema:
      oneOf:
        - $ref: '../../schemas/error-code-message.yaml'
        - $ref: '../../schemas/error-timestamp-message.yaml'
        - $ref: '../../schemas/error-status-message.yaml'
    examples:
        Catalog and Consignment:
          value:
            code: 'ERROR_DEFAULT_MESSAGE'
            message: 'An unexpected error ocurred. We will work hard to fix it as soon as possible!'
        Shops and Feeds:
          value:
            timestamp: '2026-08-11T11:09:52.606+00:00'
            status: 500
            error: Internal Server Error
            path: /api/vendor/shops
        Payments:
          value:
            message: 'An unexpected error ocurred. We will work hard to fix it as soon as possible!'
            status: 500
