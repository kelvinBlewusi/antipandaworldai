description: |-
  Bad Request. There was a problem with the request payload. Either a field is missing or a field type is not compliant with the contract.

  The body shape depends on which handler catches the failure. Both shapes below are real;
  neither is wrapped in a `data` array.
content:
  application/json:
    schema:
      oneOf:
        - $ref: '../../schemas/error-status-message.yaml'
        - $ref: '../../schemas/error-timestamp-message.yaml'
    examples:
        Orders and Payments - most failures:
          value:
            message: 'The BATATAS is an invalid status value.'
            status: 400
        Orders and Payments - invalid argument, access denied or unhandled error:
          value:
            timestamp: '2026-08-11T11:09:52.606+00:00'
            status: 400
            error: Bad Request
            message: 'The BATATAS is an invalid status value.'
