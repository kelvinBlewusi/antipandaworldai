components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT 
      description: |-
        [Bearer Token Reference](https://oauth.net/2/bearer-tokens/)

        Every request must carry the Access Token obtained from the
        [Token endpoint](#tag/Endpoints/operation/post-token), regardless of application type.

        Concatenate the word `Bearer`, a single space, and the Access Token:

        `Authorization: Bearer <Access Token>`

        Access Tokens are JSON Web Tokens (JWT) and are short-lived. Read `expires_in` from the token
        response to know how long the current one is valid for — do not hardcode a duration.

        To obtain a token, see [Step-by-Step Authentication](#tag/Step-by-Step-Authentication).
security:
  - bearerAuth: []    