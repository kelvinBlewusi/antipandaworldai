put:
  tags:
  - Orders
  summary: Cancel Orders
  description: |-
    Cancel multiple Order Items.

    The following Role is required: **VC - Order Manager**.

    When a request is made the following validations are perfomed:
    - The Request without any Order Item Ids on the Request Body / Payload.
    - The Request with an invalid Order Item Id UUID format on the Request Body / Payload.
  operationId: put-cancel-orders
  parameters:
    - in: header
      name: Authorization
      schema:
        type: string
      required: true
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            orderItemIds:
              type: array
              description: List of Order Items Id to Cancel.
              items:
                type: string
                format: uuid
          required:
            - orderItemIds
        examples:
          Request - Payload Example:
            value:
              orderItemIds: [ddf7113b-2796-4641-86ef-c4c7083d9b59,491e8821-cd54-40fd-ad58-804e96a99924]
    description: Request - Payload
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: object
                description: The list of Successful Canceled Items by Order.
                properties:
                  orderItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Order Item Id.
                          example: 41ea7c3b-20f0-466d-a095-e6e909298180
                        countryCode:
                          type: string
                          description: 'International ISO Country Code of the Order, according to https://countrycode.org'
                          example: NG
                        cancellationReason:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The Global Cancellation Id.
                              example: ff23cd81-122b-47b8-a864-e4f5531a3275
                            description:
                              type: string
                              description: The Global Cancellation Description.
                              example: Default Cancellation Reason
                          required:
                            - id
                            - description
                      required:
                        - id
                        - countryCode
                        - cancellationReason
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item canceled in this request.
                required:
                  - orderItems
                  - total
              error:
                type: object
                description: The list of unsuccessful Canceled Items.
                properties:
                  orderItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Order Item Id.
                          example: 41ea7c3b-20f0-466d-a095-e6e909298180
                        cancellationReason:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The Global Cancellation Id.
                              example: ff23cd81-122b-47b8-a864-e4f5531a3275
                            description:
                              type: string
                              description: The Global Cancellation Description.
                              example: MER 1 - Out of stock
                          required:
                            - id
                            - description
                        response:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The Error Code.
                              example: not_allowed_status
                            message:
                              type: string
                              description: The Error Message.
                              example: Only order items in pending and ready to ship status can be cancelled
                          required:
                            - code
                            - message
                      required:
                        - id
                        - cancellationReason
                        - response
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item error in this request.
                required:
                  - orderItems
                  - total        
            required:
              - success
              - error
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/orders@cancel.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/orders@cancel.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/orders@cancel.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/orders@cancel.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/orders@cancel.php'      
