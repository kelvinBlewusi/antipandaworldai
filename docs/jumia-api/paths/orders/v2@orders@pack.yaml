post:
  tags:
  - Orders
  summary: Pack Orders V2
  description: |-
    Pack Orders by multiple Order Items.
    
    The following Role is required: **VC - Order Manager**.

    **Restrictions:**
    - The Request must have at least one package
    - A package must have at least one Order Item Id
    - A package must have a  Shipment Provider Id 
    - All Order Items in a package must be in a Pending status
    - All Order Items in a package must belong to the same order
    - All Order Items in a package must be from the same country
    - All Order Items in a package must have the same Shipment Method (economy / non-economy)
    - All Order Items in a package must have the same Payment Method Type (Between Pre-payment / Post-Payment)
    - All Order Items must be Fulfilled By Jumia (ShipmentType == Dropshipping).


    When a request is made the following validations are perfomed:
    - The Request has no packages
    - A package without any Order Item Ids or with ids with invalid format
    - The  Shipment Provider Id is missing or has an invalid format.
  operationId: post-v2-orders-pack
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
            type: object
            properties:
              packages:
                type: array
                description: List of Packages.
                items:
                  type: object
                  properties:
                    orderItems:
                      type: string
                      format: uuid
                      description: Order Items id.
                      example: acadee72-28a1-4280-903a-e56a0cc0acc4
                    shipmentProviderId:
                      type: string
                      format: uuid
                      description: The Shipment Provider Id.
                      example: bcadee72-28a1-4280-903a-e56a0cc0acc3
                    trackingCode:
                      type: string
                      description: Only required if shipment provider requires the input of a tracking code
                      example: E123456
                  required:
                    - orderItems
                    - shipmentProviderId
            required:
              - packages     
    description: Request - Payload
  responses:
    '201':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: object
                description: The list of Successful Packed Items by Order.
                properties:
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        orderItems:
                          type: array
                          description: Order Item Ids.
                          items:
                            type: string
                            format: uuid
                          example: ['41ea7c3b-20f0-466d-a095-e6e909298180', 'c0aa1673-fd99-4f9e-a511-6cefdbdde266']
                        trackingCode:
                          type: string
                          description: The generated Package Tracking Code.
                          example: JG-00D-393842527-9589
                      required:
                        - orderItems
                        - trackingCode
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item successfully packed in this request.
                required:
                  - packages
                  - total
              error:
                type: object
                description: The list of unsuccessful Packed Items.
                properties:
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        orderItems:
                          type: array
                          description: Order Item Ids.
                          items:
                            type: string
                            format: uuid
                          example: ['c0aa1673-fd99-4f9e-a511-6cefdbdde265', 'c0aa1673-fd99-4f9e-a511-6cefdbdde266']
                        error:
                          type: string
                          description: The Error Message.
                          example: Order items are not from the same order.
                      required:
                        - orderItems
                        - error
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item error in this request.
                required:
                  - packages
                  - total        
            required:
              - success
              - error
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/v2@orders@pack.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/v2@orders@pack.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/v2@orders@pack.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/v2@orders@pack.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/v2@orders@pack.php'     