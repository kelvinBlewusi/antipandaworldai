post:
  tags:
  - Orders
  summary: Print Labels 
  description: |-
    Print Shipping Labels by multiple Order Items.
    
    The following Role is required: **VC - Order Manager**.

    When a request is made the following validations are perfomed:
    - The Request without any Order Item Ids on the Request Body / Payload.
    - At least one of the Order Items is not Pending.
    - At least one of the Order Items is not Packed (Without the trackingNumber associated).
    - At least one of the Order Items is not Ready to Ship.
    - At least one of the Order Items is not Shipped.
    - At least one of the Order Items is not Delivered.
    - The Order Items have a different country.
    - The Order Items have a different Shipment Provider.
    - The Order Items have a different Shipment Method (economy / non-economy).
    - The Order Items are Fulfilled By Jumia (ShipmentType == Dropshipping).
    - One or more Order Items not found or does not belong to the User's MasterShop.
  operationId: post-print-labels
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            orderItemIds:
              type: array
              description: List of Order Items to set as Ready to Ship.
              items:
                type: string
                format: uuid
                maximum: 200
          required:
            - orderItemIds
        examples:
          Request - Payload Example:
            value:
              orderItemIds: [ddf7113b-2796-4641-86ef-c4c7083d9b59,491e8821-cd54-40fd-ad58-804e96a99924]
    description: Request - Payload
  responses:
    '201':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: object
                description: The list of successfully generated labels by Package.
                properties:
                  labels:
                    type: array
                    description: The list of Generated Labels by Package
                    items:
                      type: object
                      properties:
                        orderItemIds:
                          type: array
                          description: The list of Order Item Ids.
                          items:
                            type: string
                            format: uuid
                          example: ['41ea7c3b-20f0-466d-a095-e6e909298180', 'c0aa1673-fd99-4f9e-a511-6cefdbdde266']
                        countryCode:
                          type: string
                          description: 'International ISO Country Code of the Order, according to https://countrycode.org'
                          example: NG
                        trackingNumber:
                          type: string
                          description: The package Tracking Number of the Shipping Label
                          example: JG-00D-393842527-9589
                        label:
                          type: string
                          description: The PDF label content encoded as base64 format.
                          example: bGFiZWxfY29udGVudF9pbl9wZGZfYmFzZTY0
                      required:
                        - orderItemIds
                        - countryCode
                        - trackingNumber
                        - label
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item successfully Ready to Ship in this request.
                required:
                  - labels
                  - total
              error:
                type: object
                description: The list of unsuccessful Ready to Ship Items.
                properties:
                  orderItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Order Item Id.
                          example: 41ea7c3b-20f0-466d-a095-e6e909298180
                        response:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The Error Code.
                              example: not_allowed_status
                            message:
                              type: string
                              description: The Error Message.
                              example: Only order items in pending and ready to ship status can be cancelled
                          required:
                            - code
                            - message
                      required:
                        - id
                        - response
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item error in this request.
                required:
                  - orderItems
                  - total        
            required:
              - success
              - error
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/orders@print-labels.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/orders@print-labels.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/orders@print-labels.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/orders@print-labels.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/orders@print-labels.php'     