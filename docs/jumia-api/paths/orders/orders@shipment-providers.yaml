get:
  tags:
  - Orders
  summary: Retrieve Shipment Providers
  description: |-
    Get All available Shipment Providers according to each Order Item.

    One of the following Roles are required: **VC - Order Viewer** or **VC - Order Manager**.
    
    **Path Examples**

    | Name | Example |
    | --- | --- |
    | One Order Item as Path Parameter | `/orders/shipment-providers?orderItemId=41ea7c3b-20f0-466d-a095-e6e909298180` |
    | More than one Order Item as Path Parameter | `/orders/shipment-providers?orderItemId=41ea7c3b-20f0-466d-a095-e6e909298180&orderItemId=4c5cebaa-2f25-4eb3-9cc0-17322dbdb8ef` |

    When a request is made the following validations are perfomed:
      - The Request with an invalid Order Item Id UUID format.
      - The Shipment Provider should be active.
      - The Shipment Providers should be associated with the Order Item Shop and that association should be active.
      - Only Shipment Providers with COD (Cash On Delivery) capability if the Order is Cash On Delivery.
      - Only Shipment Providers with Economic capability if the Order Item is Economic.
  operationId: get-shipment-providers
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: orderItemId
      required: True
      schema:
        type: string
        format: uuid
      description: The List of desired Order Item Ids to return its Items.
      examples:
        first:
          value: 41ea7c3b-20f0-466d-a095-e6e909298180
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              orderItems:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Id of the requested Order Item.
                      example: 41ea7c3b-20f0-466d-a095-e6e909298180
                    shipmentProviders:
                      type: array
                      description: The List of Shipment Providers related to the given requested Item.
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The Id of the Shipment Provider.
                            example: bcadee72-28a1-4280-903a-e56a0cc0acc3
                          name:
                            type: string
                            description: The Name of the Shipment Provider.
                            example: Shipment Provider 1
                          trackingCodeRequired:
                            type: boolean
                            description: Specify if a Shipment provider requires to be provided with a tracking code to create a package
                        required: 
                        - id
                        - name
                        - trackingCodeRequired
                  required:
                    - id
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/orders@shipment-providers.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/orders@shipment-providers.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/orders@shipment-providers.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/orders@shipment-providers.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/orders@shipment-providers.php'   