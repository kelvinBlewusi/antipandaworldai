    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/orders.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/orders.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/orders.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/orders.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/orders.php'      

