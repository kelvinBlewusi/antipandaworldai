get:
  tags:
  - Orders
  summary: Retrieve Orders
  description: |-
    Get All Orders of multiple Countries paginated.

    One of the following Roles are required: **VC - Order Viewer** or **VC - Order Manager**.

    Please consider the following information regarding the query parameters:
        <ul>
          <li><b><u>If the   <span style="color: #ff0000">createdAfter, createdBefore, updatedAfter</span> and <span style="color: #ff0000">updatedBefore</span> are not specified it will return the orders created today!</u></b></li>
          <li><b><u>It's only possible to use a single combination of either (<span style="color: #ff0000">createdAfter & createdBefore</span>) or (<span style="color: #ff0000">updatedAfter & updatedBefore</span>) filters.</u></b></li>
        </ul>

    **Order Item Status**

    | Status Name | Alternative Name | Status id |
    | --- | --- | --- |
    | CANCELED | canceled | 3 |
    | DELIVERED | delivered | 6 |
    | FAILED | failed | 5 |
    | PENDING | pending | 1 |
    | READY_TO_SHIP | ready_to_ship | 8 |
    | RETURNED | returned | 4 |
    | SHIPPED | shipped | 2 |

    **Path Examples**

    | Name | Example |
    | --- | --- |
    | Get Orders with no filters | `/orders` |
    | Get Orders with status and createdAt | `/orders?status=PENDING&createdAfter=2021-01-01 12:30:00&createdBefore=2021-01-01 13:00:00` |
    | Get Orders with createdAt and updatedAt | `/orders?createdAfter=2022-05-22&createdBefore=2022-05-24&updatedAfter=2022-05-22&updatedBefore=2022-05-24` |
    | Get Orders with status, updatedAt and page size | `/orders?status=PENDING,SHIPPED&updatedAfter=2021-01-01&updatedBefore=2021-01-01&size=100` |

    When a request is made the following validations are perfomed:
      - The Request with an invalid createdAfter date/datetime format.
      - The Request with an invalid createdBefore date/datetime format.
      - The Request with an invalid updatedAfter date/datetime format.
      - The Request with an invalid updatedBefore date/datetime format.
      - The Request with a createdAfter greater than createdBefore date/datetime.
      - The Request with a updatedAfter greater than updatedBefore date/datetime.
      - The Request with an invalid know status of its list.
  operationId: get-orders
  parameters:
    - in: header
      name: Authorization
      schema:
        type: string
      required: true
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: status
      schema:
        type: array
        items:
          type: string
          enum: [PENDING,SHIPPED,CANCELED,RETURNED,FAILED,DELIVERED,READY_TO_SHIP]
      required: False
      style: form
      explode: False
      description: |
        Multiple Order Item Status, as a comma-separated list.
        You must use the Status Name according to the Order Item Status table below.

        **Default Behaviour:**
        <ul>
          <li>If parameter is not present, <b>all status</b> are retrieved.</li>
          <li>There is no <code>ALL</code> value — omit the parameter to retrieve every status. Any unrecognised value is rejected with <code>400</code>.</li>
        </ul>
      examples:
        first:
          value: [PENDING]
        second:
          value: [PENDING, SHIPPED]
    - in: query
      name: country
      schema:
        type: array
        items:
          type: string
          enum: [CI,DZ,EG,GH,KE,MA,NG,SN,TN,UG,ZA]
      style: form
      explode: False
      required: False
      description: |
        Multiple countries, as a comma-separated list of ISO 3166-1 alpha-2 codes.

        **Available Countries**

        | Code | Country | Currency |
        | --- | --- | --- |
        | CI | Ivory Coast | XOF |
        | DZ | Algeria | DZD |
        | EG | Egypt | EGP |
        | GH | Ghana | GHS |
        | KE | Kenya | KES |
        | MA | Morocco | MAD |
        | NG | Nigeria | NGN |
        | SN | Senegal | XOF |
        | TN | Tunisia | TND |
        | UG | Uganda | UGX |
        | ZA | South Africa | ZAR |

        **Default Behaviour:**
        <ul>
          <li>If parameter is not present, <b>all countries</b> are retrieved.</li>
          <li>Unrecognised codes are ignored. If none of the codes sent are valid, <b>all countries</b> are retrieved.</li>
        </ul>
      examples:
        first:
          value: [NG]
        second:
          value: [NG, EG]
    - in: query
      name: shopId
      schema:
        type: string
      required: False
      description: |
        Ability to filter orders of a shop. To be used by mastershop users.

        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, all shops are retrieved.</li>
        </ul>
      examples:
        first:
          value: 41ea7c3b-20f0-466d-a095-e6e909298180
    - in: query
      name: createdAfter
      schema:
        type: string
      required: False
      description: |
        Start of createdAt date to filter. The time range can't be higher than **3 months**.
        
        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, the value will be <b>today's</b> date.</li>
        </ul>      
      examples:
        first:
          value: 2021-01-01
        second:
          value: 2022-05-20 22:30:00
    - in: query
      name: createdBefore
      schema:
        type: string
      required: False
      description: |
        End of createdAt date to filter. The time range can't be higher than **3 months**.

        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, the value will be <b>today's</b> date.</li>
        </ul>      
      examples:
        first:
          value: 2021-01-01
        second:
          value: 2022-05-20 22:30:00
    - in: query
      name: updatedAfter
      schema:
        type: string
      required: False
      description: |
        Start of updatedAt date to filter. The time range can't be higher than **3 months**.
      examples:
        first:
          value: 2021-01-01
        second:
          value: 2022-05-20 22:30:00
    - in: query
      name: updatedBefore
      schema:
        type: string
      required: False
      description: |
        End of updatedAt date to filter. The time range can't be higher than **3 months**.
      examples:
        first:
          value: 2021-01-01
        second:
          value: 2022-05-20 22:30:00        
    - in: query
      name: size
      schema:
        type: integer
        maximum: 300
      required: False
      description: |
        Size of the requested orders.
      examples:
        first:
          value: 200
    - in: query
      name: sort
      schema:
        type: string
        enum: [ASC, DESC]
      required: False
      description: |
        The sort direction, by creation date.

        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, the value will be sorted <b>ASC</b>.</li>
        </ul>          
    - in: query
      name: token
      schema:
        type: string
      required: False
      description: |
        The Token to navigate to the next page of results. This value is retrieved when there are enough orders to generate a new page (e.g. on the last page this value will be null).

        Please, also check the response section regarding **nextToken** and **isLastPage** attributes.

        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, only orders from <b>first page</b> are returned.</li>
        </ul>            
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              orders:
                type: array
                description: List of orders.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Id of the Order.
                      example: 41ea7c3b-20f0-466d-a095-e6e909298180
                    shopIds:
                      type: array
                      description: List with shopId's related with the order.
                      items:
                        type: string
                        format: uuid
                      example: [51ea8c3b-20f0-466d-a095-e6e909298547,204eb6ea-56b9-11ed-9b6a-0242ac120002]                 
                    totalItems:
                      type: integer
                      format: int64
                      description: Total of Order Items.
                      example: 1
                    packedItems:
                      type: integer
                      format: int64
                      description: Total of Order Items packed.
                      example: 1
                    isPrepayment:
                      type: boolean
                      description: The Payment method can be Pre-payment or Post-Payment. When is Pre-payment the flag is true, otherwise false.
                    hasMultipleStatus:
                      type: boolean
                      description: True if the Order has more the one Item in different Status. Please check the Loose-ends list.
                    hasItemsFulfilledByJumia:
                      type: boolean
                      description: Order has at least one Order Item fulfilled by Jumia.
                    pendingSince:
                      type: string
                      description: Calculated text to show how many days the order is pending.
                      example: 3 days
                    status:
                      type: string
                      description: The Status of the Order based on its Order Items. If the Order has more than one status, then the value "Multiple Status" is returned
                      example: PENDING
                    deliveryOption:
                      type: string
                      description: The Delivery Option (Shipment Method) of the first Item related to the Order. Please see the table list of values above.
                      enum: [Digital Delivery, Economy Shipping, Flat Rate, Free, Express, Pickup Station, Universal Shipping Matrix]
                      example: Universal Shipping Matrix
                    number:
                      type: string
                      description: The Order Number.
                      example: '338997922'
                    totalAmount:
                      type: object
                      properties:
                        currency:
                          type: string
                          description: Always USD on Vendor Center.
                          example: USD
                        value:
                          type: number
                          format: double
                          description: The Sum of Order Item Prices (Paid Price USD + Shipping Fee USD)
                          example: 123.45
                      required:
                        - currency
                        - value
                    totalAmountLocal:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: EGP
                        value:
                          type: number
                          format: double
                          example: 60.00
                      required:
                        - currency
                        - value
                    country:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Country Code
                          example: EG
                        name:
                          type: string
                          description: Country Name
                          example: EGYPT
                        currencyCode:
                          type: string
                          description: Country Currency Code
                          example: EGP
                      required:
                        - code
                        - name
                        - currencyCode
                    shippingAddress:
                      type: object
                      properties:
                        firstName:
                          type: string
                        lastName:
                          type: string
                        address:
                          type: string
                        city:
                          type: string
                        postalCode:
                          type: string
                        ward:
                          type: string
                        region:
                          type: string
                        countryName:
                          type: string
                    createdAt:
                      type: string
                      format: date-time
                      description: |
                        Created at on Seller Center database.

                        The field name on Entry-point that VC-UI uses is called **createdAtSellerCenter**
                    updatedAt:
                      type: string
                      format: date-time
                      description: |
                        Updated at on Seller Center database.

                        The field name on Entry-point that VC-UI uses is called **updatedAtSellerCenter**
                  required:
                    - id
                    - shopIds
                    - totalItems
                    - packedItems
                    - isPrepayment
                    - hasMultipleStatus
                    - hasItemsFulfilledByJumia
                    - pendingSince
                    - status
                    - deliveryOption
                    - number
                    - totalAmount
                    - country
                    - shippingAddress
                    - createdAt
                    - updatedAt
              nextToken:
                type: string
                description: |
                  The value should be used to request the next page of results.
                  If the page is last of no records are returned, the nextToken value will be **null**.
                  Please, also check **token** request parameter described above.
              isLastPage:
                type: boolean
                description: The value is **true** if there is more pages, otherwise **false**.
            required:
              - orders
              - isLastPage
              - nextToken
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
