get:
  tags:
  - Orders
  summary: Retrieve Orders items
  description: |-
    Get Order Items from multiple Orders by order Id.

    One of the following Roles are required: **VC - Order Viewer** or **VC - Order Manager**.
    
    **Path Examples**

    | Name | Example |
    | --- | --- |
    | Get Orders Items with one Order Id | `/orders/items?orderId=41ea7c3b-20f0-466d-a095-e6e909298180` |
    | Get Orders Items with multiple Order Id | `/orders/items?orderId=41ea7c3b-20f0-466d-a095-e6e909298180&orderId=f94e5592-a34c-40ff-964c-e0c80e571cd2` |

    When a request is made the following validations are perfomed:
      - The Request with an invalid Order Id UUID format.
      - The Request with an invalid Status item.
  operationId: get-orders-items
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: orderId
      required: True
      schema:
        type: string
      description: List of desired Orders to return its items
      examples:
        first:
          value: 41ea7c3b-20f0-466d-a095-e6e909298180
    - in: query
      name: status
      required: False
      style: form
      explode: False
      schema:
        type: array
        items:
          type: string
          enum: [PENDING,SHIPPED,CANCELED,RETURNED,FAILED,DELIVERED,READY_TO_SHIP]
      description: |
        Multiple Order Item Status, as a comma-separated list.
        You must use the Status Name according to the Order Item Status table below.

        **Default Behaviour:**
        <ul>
          <li>If parameter is not present, <b>all status</b> are retrieved.</li>
        </ul>
      examples:
        first:
          value: [PENDING]
        second:
          value: [PENDING, SHIPPED]
    - in: query
      name: shopId
      required: False
      schema:
        type: string
      description: |
        Ability to filter orders of a shop. To be used by mastershop users.

        **Default Behaviour:** 
        <ul>
          <li>If parameter is not present, all shops related order items are retrieved..</li>
        </ul>
      examples:
        first:
          value: 41ea7c3b-20f0-466d-a095-e6e909298180
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              orderId:
                type: string
                format: uuid
                description: The Order Id.
                example: 41ea7c3b-20f0-466d-a095-e6e909298180
              orderNumber:
                type: string
                description: The Order Number.
                example: "123456789"
              items:
                type: array
                description: List of Order Items.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Id of Order Item.
                      example: 41ea7c3b-20f0-466d-a095-e6e909298180
                    shopId:
                      type: string
                      format: uuid
                      description: Id of the Shop.
                      example: 41ea7c3b-20f0-466d-a095-e6e909298180
                    status:
                      type: string
                      description: The status of the Order Item.
                    trackingNumber:
                      type: string
                      description: The Tracking Code if the Item is already packed.
                      example: DS-328697922-9143
                    trackingUrl:
                      type: string
                      format: uri
                      description: The Tracking Code URL if the Item is already packed.
                      example: https://packagetracker-dev.jumia.services/#/MA/en/package/tracking/DS-328697922-9143
                    shipmentType:
                      type: string
                      enum: [Own Warehouse, Dropshipping, Cross docking]
                      example: Dropshipping
                    deliveryOption:
                      type: string
                      description: The Delivery Option (Shipment Method) of the Order.
                    isFulfilledByJumia:
                      type: boolean
                      description: Order Item is fulfilled by Jumia.
                    itemPrice:
                      type: number
                      format: double
                      description: Unit Price in USD.
                      example: 10.5
                    paidPrice:
                      type: number
                      format: double
                      description: Paid Price in USD.
                      example: 9.75
                    shippingAmount:
                      type: number
                      format: double
                      description: Shipping Fee in USD.
                      example: 1.25
                    itemPriceLocal:
                      type: number
                      format: double
                      description: Unit Price in the local currency of the Order's country.
                      example: 16800
                    paidPriceLocal:
                      type: number
                      format: double
                      description: Paid Price in the local currency of the Order's country.
                      example: 15600
                    shippingAmountLocal:
                      type: number
                      format: double
                      description: Shipping Fee in the local currency of the Order's country.
                      example: 2000
                    exchangeRate:
                      type: number
                      format: double
                      description: Exchange Rate applied between USD and the local currency.
                      example: 1600
                    country:
                      type: object
                      description: Country of the Order
                      properties:
                        code:
                          type: string
                          example: EG
                        name:
                          type: string
                          example: Egypt
                        currencyCode:
                          type: string
                          example: EGP
                      required:
                        - code
                        - name
                        - currencyCode
                    taxAmount:
                      type: number
                      format: double
                      description: Tax Amount in local currency
                    voucherAmount:
                      type: number
                      format: double
                      description: Voucher Amount in local currency
                    product:
                      type: object
                      description: The Product related to Order Item.
                      properties:
                        name:
                          type: string
                          description: The Product name.
                          example: Product Name 1
                        sellerSku:
                          type: string
                          description: Product Sku.
                          example: XXX-SKU-001
                        imageUrl:
                          type: string
                          format: uri
                          description: The Product main image URL.
                          example: https://ma.jumia.is/qMgvV8E3jm2EpKUIJ7n3TYBixvs=/fit-in/500x500/filters:fill(white)/product/65/331243/1.jpg?5082
                      required:
                        - name
                        - sellerSku
                        - imageUrl
                    shippingAddress:
                      type: object
                      properties:
                        firstName:
                          type: string
                        lastName:
                          type: string
                        address:
                          type: string
                        city:
                          type: string
                        postalCode:
                          type: string
                        ward:
                          type: string
                        region:
                          type: string
                        countryName:
                          type: string
                  required:
                    - id
                    - shopId
                    - product
                    - status
                    - trackingNumber
                    - trackingUrl
                    - shipmentType
                    - deliveryOption
                    - isFulfilledByJumia
                    - itemPrice
                    - paidPrice
                    - shippingAmount
                    - itemPriceLocal
                    - paidPriceLocal
                    - shippingAmountLocal
                    - exchangeRate
                    - country
                    - taxAmount
                    - voucherAmount
                    - shippingAddress
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
