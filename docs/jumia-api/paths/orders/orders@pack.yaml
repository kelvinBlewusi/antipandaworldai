post:
  tags:
  - Orders
  summary: Pack Orders
  description: |-
    Pack Orders by multiple Order Items.
    
    The following Role is required: **VC - Order Manager**.

    When a request is made the following validations are perfomed:
    - The Request without any Order Item Ids on the Request Body / Payload.
    - The Request without the Shipment Provider Id on the Request Body / Payload.
    - At least one of the Order Items is not Pending.
    - At least one of the Order Items is already Packed yet.
    - The Order Items have a different country
    - The Order Items have a different Shipment Provider
    - The Order Items have a different Shipment Method (economy / non-economy)
    - The Order Items have a different Payment Method Type (Between Pre-payment / Post-Payment)
    - The Order Items are Fulfilled By Jumia (ShipmentType == Dropshipping).
    - One or more Order Items not found or does not belong to the User's MasterShop.
    - The Shipment Provider not found.
  operationId: post-orders-pack
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
            type: object
            properties:
              orderItems:
                type: array
                description: List of Order Items to Pack.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Order Items id.
                      example: acadee72-28a1-4280-903a-e56a0cc0acc4
                    shipmentProviderId:
                      type: string
                      format: uuid
                      description: The Shipment Provider Id.
                      example: bcadee72-28a1-4280-903a-e56a0cc0acc3
                  required:
                    - id
                    - shipmentProviderId
    description: Request - Payload
  responses:
    '201':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: object
                description: The list of Successful Packed Items by Order.
                properties:
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        orderItems:
                          type: array
                          description: Order Item Ids.
                          items:
                            type: string
                            format: uuid
                          example: ['41ea7c3b-20f0-466d-a095-e6e909298180', 'c0aa1673-fd99-4f9e-a511-6cefdbdde266']
                        countryCode:
                          type: string
                          description: 'International ISO Country Code of the Order, according to https://countrycode.org'
                          example: NG
                        trackingNumber:
                          type: string
                          description: The generated Package Tracking Code.
                          example: JG-00D-393842527-9589   
                      required:
                        - orderItems
                        - countryCode
                        - trackingNumber
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item successfully packed in this request.
                required:
                  - packages
                  - total
              error:
                type: object
                description: The list of unsuccessful Packed Items.
                properties:
                  orderItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Order Item Id.
                          example: 41ea7c3b-20f0-466d-a095-e6e909298180
                        response:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The Error Code.
                              example: not_allowed_status
                            message:
                              type: string
                              description: The Error Message.
                              example: Only order items in pending and ready to ship status can be cancelled
                          required:
                            - code
                            - message
                      required:
                        - id
                        - response
                  total:
                    type: integer
                    format: int64
                    description: Total of Order Item error in this request.
                required:
                  - orderItems
                  - total        
            required:
              - success
              - error
    '400':
      $ref: '../../components/responses/gop-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gop-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gop-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gop-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gop-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gop-api/error422.yaml'    
    '500':
      $ref: '../../components/responses/gop-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gop-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/orders@pack.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/orders@pack.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/orders@pack.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/orders@pack.go'      
    - lang: 'php'
      source:  
        $ref: '../../code-samples/php/orders@pack.php'     