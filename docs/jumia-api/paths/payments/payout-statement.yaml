get:
  tags:
    - Payments
  summary: Retrieve Payout Statement
  description: |-
    Request statement and payout status information via API so that payment partners can reconcile payment details.

    <b><u>If <span style="color: #ff0000">createdAfter</span> is not specified, it defaults to <span style="color: #ff0000">90 days ago</span>.</u></b>
  operationId: get-payout-statement
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: createdAfter
      required: false
      schema:
        type: string
      description: |
        Filter statements created after this date, in the format YYYY-MM-DD or YYYY-MM-DD HH:mm:ss.
        If not specified, defaults to 90 days ago.
      examples:
        date:
          value: 2025-01-01
        datetime:
          value: 2025-05-20 22:30:00
    - in: query
      name: page
      required: false
      schema:
        type: integer
        default: 1
      description: Page number for pagination
    - in: query
      name: size
      required: false
      schema:
        type: integer
        default: 50
      description: Number of results per page (maximum 1000)
    - in: query
      name: paid
      required: false
      schema:
        type: boolean
      description: Filter by payment status (true for paid, false for unpaid)
    - in: query
      name: country
      required: false
      schema:
        type: string
      description: Filter by country
    - in: query
      name: currency
      required: false
      schema:
        type: string
        default: USD
        enum: [LOCAL, USD]
      description: Return amounts either in local currency or in USD. Default is USD.
  responses:
    '200':
      description: OK. The info was retrieved
      content:
        application/json:
          schema:
            type: object
            properties:
              statements:
                type: array
                items:
                  type: object
                  properties:
                    statementNumber:
                      type: string
                      description: Unique identifier for the statement
                    shopSid:
                      type: string
                      format: uuid
                      description: Unique identifier for the shop
                    createdAt:
                      type: string
                      example: '2024-05-06 03:02:41'
                      description: |-
                        Date and time when the statement was created, in the format `yyyy-MM-dd HH:mm:ss`.

                        Note this is a space-separated timestamp, not an ISO-8601 `date-time`.
                    updatedAt:
                      type: string
                      example: '2024-05-06 03:02:41'
                      nullable: true
                      description: |-
                        Date and time when the statement was last updated, in the format
                        `yyyy-MM-dd HH:mm:ss`. `null` until the statement is first updated.
                    openingBalance:
                      type: number
                      description: Opening balance amount
                    itemRevenue:
                      type: number
                      description: Revenue from items sold
                    shipmentFee:
                      type: number
                      description: Fees related to shipment
                    shipmentFeeCredit:
                      type: number
                      description: Credits for shipment fees
                    otherRevenueTotal:
                      type: number
                      description: Total of other revenue sources
                    feesTotal:
                      type: number
                      description: Total of all fees
                    subtotal1:
                      type: number
                      description: Subtotal (itemRevenue + otherRevenueTotal - feesTotal)
                    refunds:
                      type: number
                      description: Total refund amount
                    feesOnRefundsTotal:
                      type: number
                      description: Total fees on refunds
                    subtotal2:
                      type: number
                      description: Subtotal after refunds (subtotal1 - refunds)
                    closingBalance:
                      type: number
                      description: Closing balance amount
                    guaranteeDeposit:
                      type: number
                      description: Guarantee deposit amount
                    payout:
                      type: object
                      properties:
                        amount:
                          type: number
                          format: float
                          description: Payout amount
                        currency:
                          type: string
                          description: Currency code
                    paid:
                      type: boolean
                      description: Payment status (true for paid, false for unpaid)
                    paymentReference:
                      type: string
                      nullable: true
                      description: Reference for the payment
                    subsidy:
                      type: number
                      description: Subsidy amount
                    subsidyRefund:
                      type: number
                      description: Subsidy refund amount
              page:
                type: object
                properties:
                  current:
                    type: integer
                    description: Current page number
                  totalOfPages:
                    type: integer
                    description: Total number of pages available
          examples:
            Response - Payload Example:
              value:
                statements:
                  - statementNumber: "CI11GN8-20240505"
                    shopSid: "b0f3c4d2-5a1e-4b8c-9f3d-7e6f8a1b2c3d"
                    createdAt: "2024-05-06 03:02:41"
                    updatedAt: null
                    openingBalance: 0
                    itemRevenue: 0
                    shipmentFee: 0
                    shipmentFeeCredit: 0
                    otherRevenueTotal: 0
                    feesTotal: 0
                    subtotal1: 0
                    refunds: 0
                    feesOnRefundsTotal: 0
                    subtotal2: 0
                    closingBalance: 0
                    guaranteeDeposit: 0
                    payout:
                      amount: 0.00
                      currency: "XOF"
                    paid: false
                    paymentReference: null
                    subsidy: 0
                    subsidyRefund: 0
                page:
                  current: 1
                  totalOfPages: 1
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source:
        $ref: '../../code-samples/curl/payout-statement.txt'
    - lang: 'python'
      source:
        $ref: '../../code-samples/python/payout-statement.py'
    - lang: 'java'
      source:
        $ref: '../../code-samples/java/payout-statement.java'
    - lang: 'go'
      source:
        $ref: '../../code-samples/go/payout-statement.go'
    - lang: 'php'
      source:
        $ref: '../../code-samples/php/payout-statement.php'
