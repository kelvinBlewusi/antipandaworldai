post:
  tags:
  - Consignment
  summary: Create Consignment Order
  description: |-
    Request a new consignment order creation.

    **Limit of Records:** Max 2000 items per request.
  operationId: post-consignment-order
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            shopId:
              type: string
              format: uuid
              description: Shop SID
            businessClientCode:
              type: string
              description: Business client identifier (ex. jumia-ma, jumia-ng)
            shippingDate:
              type: string
              example: '2022-03-25 10:09:00'
              description: |-
                Shipping date and time, in the format `yyyy-MM-dd HH:mm:ss`.

                Note this is a space-separated timestamp, not an ISO-8601 `date-time` — the `T`
                separator and a trailing `Z` are not accepted.
            comment:
              type: string
              description: Seller SKU.
            products:
              type: array
              description: 'List of products '
              items:
                type: object
                properties:
                  sku:
                    type: string
                    description: 'Product sku identifier (jumia_sku)'
                  quantity:
                    type: number
                    description: Product quantity
                    minimum: 1
                  labelCode:
                    type: string
                    description: Product label code
                required:
                  - sku
                  - quantity
          required:
            - shopId
            - businessClientCode
            - shippingDate
            - products
        examples:
          Request - Payload Example:
            value:
              shopId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              businessClientCode: jumia-ma
              shippingDate: '2022-03-25 10:09:00'
              comment: small comment
              products:
                - sku: 'AP009BM01Y4VNNAFAMZ-26956597'
                  quantity: 1
                  labelCode: product-a
    description: Request - Payload
  responses:
    '201':
      description: Created. The consignment order was successfully created
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                purchaseOrderNumber: 123432as
            properties:
              purchaseOrderNumber:
                type: string
                description: The purchase order number.
            required:
              - purchaseOrderNumber
          examples:
            Response - Payload Example:
              value:
                purchaseOrderNumber: 123432as
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gpm-api/error422.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source:
        $ref: '../../code-samples/curl/consignment-order.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/consignment-order.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/consignment-order.java'      
    - lang: 'go'
      source:
        $ref: '../../code-samples/go/consignment-order.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/consignment-order.php'      
