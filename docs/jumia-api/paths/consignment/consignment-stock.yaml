get:
  tags:
    - Consignment
  summary: Retrieve Consignment Stock
  description: Updated consignment order  with new information.
  operationId: get-consignment-stock
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: businessClientCode
      required: true
      schema:
        type: string
      description: Business client identifier (ex. jumia-ma, jumia-ng)
    - in: query
      name: sku
      required: true
      schema:
        type: string
      description: 'Product sku identifier '
  responses:
    '200':
      description: OK. The info was retreaved
      content:
        application/json:
          schema:
            type: object
            properties:
              simpleSku:
                type: string
                description: Product sku identifier 
              received:
                type: number
                description: Consignment orders received
              quarantined:
                type: number
                description: Consignment orders quarantined
              defective:
                type: number
                description: Consignment orders with faults
              canceled:
                type: number
                description: Consignment orders canceled
              returned:
                type: number
                description: Consignment orders returned
              failed:
                type: number
                description: Consignment orders failed
          examples:
            Response - Payload Example:
              value:
                simpleSku: string
                received: 0
                quarantined: 0
                defective: 0
                canceled: 0
                returned: 0
                failed: 0
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/consignment-stock.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/consignment-stock.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/consignment-stock.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/consignment-stock.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/consignment-stock.php'      
