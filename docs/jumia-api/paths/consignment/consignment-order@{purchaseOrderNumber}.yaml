parameters:
  - in: path
    required: true
    schema:
      type: string
      example: 123abc
    name: purchaseOrderNumber
    description: The purchase order number returned when the consignment order was created.
patch:
  tags:
  - Consignment
  summary: Update Consignment Order
  description: Updated consignment order  with new information.
  operationId: patch-consignment-order-purchaseOrderNumber
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            isShipped:
              type: boolean
              description: 'Consignment order Is shipped status '
            trackingNumber:
              type: string
              description: |-
                Delivery tracking number. 

                Please consider the following condition regarding the **trackingNumber** required status:

                | isShipped | Required |
                | --- | --- |
                | True | YES |
                | False | NO |
            actualDepartureDate:
              type: string
              format: date
              example: '2022-02-01'
              description: 'Delivery departure date, in the format `yyyy-MM-dd`.'
            estimatedArrivalDate:
              type: string
              format: date
              example: '2022-02-01'
              description: 'Delivery estimated arrival date, in the format `yyyy-MM-dd`.'
            deliveryAgentPhoneNumber:
              type: string
              description: Delivery Agent phone number
            nameOf3PL:
              type: string
              description: 'Delivery Third-party logistics name '
          required:
            - isShipped
            - trackingNumber
        examples:
          Request - Payload Example:
            value:
              isShipped: true
              trackingNumber: string
              actualDepartureDate: '2022-02-01'
              estimatedArrivalDate: '2022-02-01'
              deliveryAgentPhoneNumber: string
              nameOf3PL: string
  responses:
    '200':
      description: OK. The consignment order was successfully updated
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '422':
      $ref: '../../components/responses/gpm-api/error422.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/consignment-order@{purchaseOrderNumber}.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/consignment-order@{purchaseOrderNumber}.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/consignment-order@{purchaseOrderNumber}.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/consignment-order@{purchaseOrderNumber}.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/consignment-order@{purchaseOrderNumber}.php'      
