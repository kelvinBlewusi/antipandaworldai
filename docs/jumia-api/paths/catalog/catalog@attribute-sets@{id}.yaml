parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: Attribute Set ID of the desired list of Attributes.
get:
  tags:
    - Catalog
  summary: Retrieve Attributes
  description: |-
    Get all active Attributes in a Given Attribute Set.

    **Paginated:** No, returns all attributes for the given attribute set.

    **Attribute types**

    | type | Attribute type |
    | --- | --- |
    | 0 | TEXT |
    | 1 | TEXT_AREA |
    | 2 | NUMBER |
    | 3 | MULTI_SELECTION |
    | 4 | SELECTION |
    | 5 | DATE |
    | 6 | BOOLEAN |
    | 7 | DATE_TIME |
    | 8 | NUMBER_FLOAT |
  operationId: get-catalog-attribute-sets-id
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              attributes:
                type: array
                description: List of Attributes.
                items:
                  type: object
                  properties:
                    sid:
                      type: string
                      description: Attribute identifier.
                      format: uuid
                    code:
                      type: number
                      description: Attribute Id.
                    name:
                      type: string
                      description: Attribute Name.
                    description:
                      type: string
                      description: Attribute Description.
                    type:
                      type: integer
                      enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
                      description: |-
                        The attribute type, returned as a **number**. Map it to a name using the
                        Attribute types table above.
                    mandatory:
                      type: boolean
                      description: Define if the attribute is mandatory.
                    variation:
                      type: boolean
                      description: Define if the attribute is the variation of Product Sets.
                    translatable:
                      type: boolean
                      description: Define if the attribute has description translations.
                    translations:
                      type: array
                      description: List of Descriptions translated to the target language.
                      items:
                        type: object
                        properties:
                          languageId:
                            type: number
                            description: Translation Id.
                          languageCode:
                            type: string
                            description: 'Available languages: EN, FR and AR.'
                          translation:
                            type: string
                            description: Translation.
                        required:
                          - languageCode
                          - translation
                    options:
                      type: array
                      description: List of attribute options when the attribute is SELECTION or MULTI_SELECTION
                      items:
                        type: object
                        properties:
                          id:
                            type: number
                            description: Attribute Option numeric identifier.
                          sid:
                            type: string
                            description: Attribute Option identifier.
                            format: uuid
                          name:
                            type: string
                            description: Attribute Option value.
                          position:
                            type: number
                            description: Attribute Option position.
                          isDefault:
                            type: boolean
                            description: Define if the Attribute Option is the default option.
                          status:
                            type: string
                            enum: [ACTIVE, INACTIVE, DELETED]
                            description: Attribute Option status.
                          translations:
                            type: array
                            description: List of Attribute Option values translated to the target language.
                            items:
                              type: object
                              properties:
                                languageId:
                                  type: number
                                  description: Translation Id.
                                languageCode:
                                  type: string
                                  description: 'Available languages: EN, FR and AR.'
                                translation:
                                  type: string
                                  description: Translation.
                        required:
                          - id
                          - sid
                          - name
                          - position
                          - isDefault
                          - status
                    validations:
                      type: object
                      description: |-
                        The validation rules that apply to this attribute.

                        This is a single object, not a list. Every field is optional and only the rules
                        relevant to the attribute's `type` are populated — the rest are `null`.
                      properties:
                        dateFormat:
                          type: string
                          nullable: true
                          description: Required date format for the attribute value.
                        decimalPlaces:
                          type: number
                          nullable: true
                          description: Number of decimal places allowed.
                        maxLength:
                          type: number
                          nullable: true
                          description: Maximum length of the attribute value.
                        minLength:
                          type: number
                          nullable: true
                          description: Minimum length of the attribute value.
                        percentage:
                          type: boolean
                          nullable: true
                          description: Whether the value is a percentage.
                        notZeroOrNegative:
                          type: boolean
                          nullable: true
                          description: Whether the value must be greater than zero.
                        selectedByDefault:
                          type: boolean
                          nullable: true
                          description: Whether the attribute is selected by default.
                  required:
                    - code
                    - name
                    - description
                    - type
                    - mandatory
                    - variation
                    - translatable
            required:
              - attributes
          examples:
            Success Response - Payload Example:
              value:
                attributes:
                  - sid: bac3047c-f2a3-46bc-864a-efce8d7cfb1b
                    code: 1000082
                    name: package_content
                    description: Whats in the box?
                    type: 4
                    mandatory: true
                    variation: false
                    translatable: true
                    translations:
                      - languageId: 1
                        languageCode: EN
                        translation: Whats in the box?
                      - languageId: 2
                        languageCode: AR
                        translation: Whats in the box?
                      - languageId: 3
                        languageCode: FR
                        translation: Whats in the box?
                  - code: 1000256
                    name: age_range
                    description: Age Range
                    type: 0
                    mandatory: true
                    variation: false
                    translatable: false
                    translations: []
                    options:
                      - id: 5241
                        sid: 01d04b74-73d5-460c-a884-0fdeb66f6094
                        name: Digital
                        position: 1
                        isDefault: false
                        status: ACTIVE
                        translations: []
                      - id: 5242
                        sid: 01d10986-2a29-4b63-8310-c2f33ba1e14b
                        name: Hard back
                        position: 2
                        isDefault: false
                        status: ACTIVE
                        translations: []
                      - id: 5243
                        sid: 01d28647-99ee-46ec-9812-70e2b0e821e3
                        name: Paperback
                        position: 3
                        isDefault: false
                        status: ACTIVE
                        translations: []
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      description: Not Found. The URL or resource doesn't exist.
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                error:
                  message: 'The Attribute Set [01d28647-99ee-46ec-9812-70e2b0e821e3] not found.'
            properties:
              error:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: The Error message.
            required:
              - error
          examples:
            Example 1:
              value:
                error:
                  message: 'The Attribute Set [01d28647-99ee-46ec-9812-70e2b0e821e3] not found.'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
