get:
  tags:
    - Catalog
  summary: Retrieve Categories
  description: |-
    Get all active Categories in at least one Business Client from PIM Catalog.

    **Paginated:** Yes.
  operationId: get-catalog-categories
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: page
      schema:
        type: number
        default: 1
      description: 'Page Number,  otherwise the first page be returned.'
    - in: query
      name: size
      schema:
        type: number
      description: 'The number of desired records per page. If not provided, the service default page size is used.'
    - in: query
      name: attributeSetName
      schema:
        type: string
      description: Attribute Set name to filter the categories.
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              categories:
                type: array
                description: List of Categories.
                items:
                  type: object
                  properties:
                    code:
                      type: number
                      description: Category Id.
                    name:
                      type: string
                      description: Category Name.
                    completePath:
                      type: string
                      description: The all parent Categories Names separated by "/".
                    hasChildren:
                      type: boolean
                      description: Whether this Category has child Categories beneath it.
                    attributeSet:
                      type: object
                      required:
                        - sid
                        - name
                      properties:
                        sid:
                          type: string
                          description: Id of the Attribute Set. Pass this to the Retrieve Attributes endpoint.
                          format: uuid
                        name:
                          type: string
                          description: Attribute Set Name.
                  required:
                    - code
                    - name
                    - completePath
                    - hasChildren
                    - attributeSet
              page:
                type: object
                description: Pagination details.
                required:
                  - current
                  - totalOfPages
                properties:
                  current:
                    type: integer
                    description: The current page number.
                  totalOfPages:
                    type: integer
                    description: Total number of pages available.
            required:
              - categories
              - page
          examples:
            Success Response - Payload Example:
              value:
                categories:
                  - code: 1000052
                    name: Foreign Language Study
                    completePath: 'Books, Movies and Music / Art & Humanities / Foreign Language Study'
                    hasChildren: false
                    attributeSet:
                      sid: 9b66c50c-562a-4a98-9eae-0cf133a50f9d
                      name: Books & Magazines
                  - code: 1020202
                    name: Tire & Wheel Tools
                    completePath: Automobile / Tools & Equipment / Tire & Wheel Tools
                    hasChildren: true
                    attributeSet:
                      sid: ba808961-18be-4b5b-bf10-076f398f2ed2
                      name: Vehicle & Parts
                page:
                  current: 1
                  totalOfPages: 42
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/catalog@categories.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/catalog@categories.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/catalog@categories.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/catalog@categories.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/catalog@categories.php'      
