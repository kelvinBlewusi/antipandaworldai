get:
  tags:
    - Catalog
  summary: Retrieve Products
  description: |-
    Get Products paginated.

    **Paginated:** Yes, by "Next token" approach (same as GOP "Get Orders" API).

    **List of Product Status**

    | Status |
    | --- |
    | ACTIVE |
    | INACTIVE |
    | DELETED |

    **List of QC Status**

    | Status |
    | --- |
    | NOT_READY_TO_QC |
    | PENDING |
    | APPROVED |
    | REJECTED |
  operationId: get-catalog-products
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: token
      schema:
        type: string
    - in: query
      name: size
      schema:
        type: integer
        format: int64
        default: 10
      description: The number of desired records between 1 and 100.
    - in: query
      name: sids
      schema:
        type: array
        items:
          type: string
      description: Product sids to filter in
    - in: query
      name: categoryCode
      schema:
        type: integer
        format: int64
      description: category codes returned from getCategory API.
    - in: query
      name: createdAtFrom
      schema:
        type: string
        format: date
        example: '2020-09-15'
      description: 'creation date filter in '
    - in: query
      name: createdAtTo
      schema:
        type: string
        format: date
        example: '2020-09-15'
      description: 'creation date filter in '
    - in: query
      name: sellerSku
      schema:
        type: string
      description: 'Filter products by sellerSKU '
    - in: query
      name: shopId
      schema:
        type: string
        format: uuid
      description: Filter products by shopId
    - in: query
      name: status
      schema:
        type: string
        enum: [ACTIVE, INACTIVE]
      description: |-
        Filter products by status.

        Only `ACTIVE` and `INACTIVE` are accepted as a filter. `DELETED` appears in the
        **List of Product Status** table above because it can be returned in the response,
        but it cannot be used to filter.
    - in: query
      name: qcStatus
      schema:
        type: string
      description: Filter products by QC status. Use a value from the **List of QC Status** table above.
    - in: query
      name: visible
      schema:
        type: boolean
      description: |-
        Filter products by their visibility on the business client.

        **Default Behaviour:** if the parameter is not present, products are returned regardless of visibility.
    - in: query
      name: latestFirst
      schema:
        type: boolean
      description: |-
        Return the most recently created products first.

        **Default Behaviour:** if the parameter is not present, products are returned oldest first.
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              products:
                type: array
                description: List of products.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Product Set Sid.
                    name:
                      type: string
                    description:
                      type: string
                    parentSku:
                      type: string
                    shop:
                      type: object
                      description: Shop.
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          description: Shop UVR SID.
                          format: uuid
                    brand:
                      type: object
                      required:
                        - code
                        - name
                      properties:
                        code:
                          type: string
                          example: '1126253'
                        name:
                          type: string
                    category:
                      type: object
                      required:
                        - code
                        - name
                      properties:
                        code:
                          type: string
                          example: '1004141'
                        name:
                          type: string
                    additionalCategories:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            example: '1004141'
                          name:
                            type: string
                        required:
                          - code
                          - name
                    images:
                      type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                          originalUrl:
                            type: string
                          primary:
                            type: boolean
                        required:
                          - url
                          - originalUrl
                          - primary
                    attributeSetId:
                      type: string
                      description: 'The attributeSet UUID of the product. '
                      format: uuid
                    attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          value:
                            type: string
                          translations:
                            type: array
                            items:
                              properties:
                                language:
                                  type: string
                                value:
                                  type: string
                        required:
                          - id
                          - name
                          - value
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    variations:
                      type: array
                      description: Product variation.
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          sellerSku:
                            type: string
                            description: Seller SKU - Stock Keeping Unit
                          barcodeEan:
                            type: string
                            description: Bar Code EAN Number
                            nullable: true
                          variation:
                            type: string
                            description: Attribute variation Value.
                          globalPrice:
                            type: object
                            description: Global Price
                            properties:
                              currency:
                                type: string
                                nullable: true
                                description: Currency of the global price. `null` when no global price has been set.
                                example: USD
                              value:
                                type: number
                                nullable: true
                              salePrice:
                                type: object
                                nullable: true
                                properties:
                                  value:
                                    type: number
                                  startAt:
                                    type: string
                                    format: date-time
                                  endAt:
                                    type: string
                                    format: date-time
                                required:
                                  - value
                                  - startAt
                                  - endAt
                          attributes:
                            type: array
                            description: Simple Attributes of the Variation level.
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                value:
                                  type: string
                                  description: All Attribute values are String regardless the attribute type in order to have a generic field.
                                translations:
                                  type: array
                                  items:
                                    properties:
                                      language:
                                        type: string
                                      value:
                                        type: string
                              required:
                                - id
                                - name
                          businessClients:
                            type: array
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                name:
                                  type: string
                                countryName:
                                  type: string
                                countryCode:
                                  type: string
                                sku:
                                  type: string
                                  nullable: true
                                visible:
                                  type: boolean
                                visibleUpdatedAt:
                                  type: string
                                  format: date-time
                                  nullable: true
                                status:
                                  type: string
                                  enum: [ACTIVE, INACTIVE, DELETED]
                                qc:
                                  type: object
                                  required:
                                    - status
                                    - updatedAt
                                    - lastApprovedAt
                                  properties:
                                    status:
                                      type: string
                                      description: 'NOT_READY_TO_QC, PENDING, APPROVED, REJECTED'
                                    updatedAt:
                                      type: string
                                      format: date-time
                                    lastApprovedAt:
                                      type: string
                                      format: date-time
                                    rejectionReason:
                                      type: string
                                      description: Reason why QC failed on approval.
                                    rejectionComment:
                                      type: string
                                      description: Comment on rejection.
                                price:
                                  type: object
                                  properties:
                                    localCurrency:
                                      type: string
                                      nullable: true
                                      description: Currency of the business client's country.
                                      example: EGP
                                    localValue:
                                      type: number
                                      nullable: true
                                      description: Price in the business client's local currency.
                                    currency:
                                      type: string
                                      nullable: true
                                      description: Currency the global price is expressed in.
                                      example: USD
                                    value:
                                      type: number
                                      nullable: true
                                    salePrice:
                                      type: object
                                      nullable: true
                                      properties:
                                        localValue:
                                          type: number
                                          description: Sale price in the business client's local currency.
                                        value:
                                          type: number
                                        startAt:
                                          type: string
                                          format: date-time
                                        endAt:
                                          type: string
                                          format: date-time
                                      required:
                                        - value
                                        - startAt
                                        - endAt
                              required:
                                - code
                                - name
                                - countryName
                                - countryCode
                                - sku
                                - visible
                                - visibleUpdatedAt
                                - status
                                - qc
                                - price
                        required:
                          - id
                          - sellerSku
                          - barcodeEan
                          - variation
                          - globalPrice
                          - attributes
                          - businessClients
                  required:
                    - id
                    - name
                    - description
                    - parentSku
                    - shop
                    - brand
                    - category
                    - images
                    - attributeSetId
                    - attributes
                    - createdAt
                    - updatedAt
                    - variations
              nextToken:
                type: string
                description: Pagination token.
                nullable: true
              isLastPage:
                type: boolean
                description: Indicates if there are more pages to iterate.
            required:
              - products
