get:
  tags:
    - Catalog
  summary: Retrieve Sales Order Item
  description: |-
    Get a single sales order item by its Order Item Sid and status, together with the product it
    reserves stock for.

    This is the stock service's view of an order item — it is the record that drives reserved and
    allocated stock for a product. Use it to reconcile a stock movement back to the order item that
    caused it.

    **Paginated:** No. The Order Item Sid and status together identify at most one record.

    **Sales Order Item Status**

    | Status | Effect on stock |
    | --- | --- |
    | PENDING | Stock is reserved for the item. |
    | SHIPPED | Stock is deducted from the allocated quantity. |
    | CANCELED | The reservation is released back to available stock. |
  operationId: get-catalog-stock-salesorderitem-orderItemSid
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: path
      name: orderItemSid
      required: true
      schema:
        type: string
        format: uuid
        example: 41ea7c3b-20f0-466d-a095-e6e909298180
      description: The Seller Center Order Item Sid, as returned by the GOP "Get Order Items" API.
    - in: query
      name: status
      required: true
      schema:
        type: string
        enum: [PENDING, SHIPPED, CANCELED]
      description: |-
        The status of the sales order item to retrieve. Required — there is no default.

        Matching is case-insensitive, so `pending` and `PENDING` are equivalent. Any other value is
        rejected with `400`.
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              orderNumber:
                type: string
                description: The Order Number the item belongs to.
              status:
                type: string
                enum: [PENDING, SHIPPED, CANCELED]
                description: The current status of the sales order item.
              orderItemSid:
                type: string
                format: uuid
                description: The Seller Center Order Item Sid.
              productSid:
                type: string
                format: uuid
                description: The Sid of the product whose stock this item reserves.
            required:
              - orderNumber
              - status
              - orderItemSid
              - productSid
          examples:
            Success Response - Payload Example:
              value:
                orderNumber: '338997922'
                status: PENDING
                orderItemSid: 41ea7c3b-20f0-466d-a095-e6e909298180
                productSid: d335de79-79c4-4403-b6eb-0ea6a0efe43e
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source:
        $ref: '../../code-samples/curl/catalog@stock@salesorderitem@{orderItemSid}.txt'
    - lang: 'python'
      source:
        $ref: '../../code-samples/python/catalog@stock@salesorderitem@{orderItemSid}.py'
    - lang: 'java'
      source:
        $ref: '../../code-samples/java/catalog@stock@salesorderitem@{orderItemSid}.java'
    - lang: 'go'
      source:
        $ref: '../../code-samples/go/catalog@stock@salesorderitem@{orderItemSid}.go'
    - lang: 'php'
      source:
        $ref: '../../code-samples/php/catalog@stock@salesorderitem@{orderItemSid}.php'
