get:
  tags:
    - Catalog
  summary: Retrieve Brands
  description: |-
    Get all active Brands in at least one Business Client from Catalog.

    **Paginated:** Yes.
  operationId: get-catalog-brands
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: page
      schema:
        type: number
        default: 1
      description: 'Page Number,  otherwise the first page be returned.'
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              brands:
                type: array
                description: List of brands.
                items:
                  type: object
                  properties:
                    code:
                      type: number
                      description: Brand Id.
                    name:
                      type: string
                      description: Brand Global Name. Without translations.
                  required:
                    - code
                    - name
              page:
                type: object
                required:
                  - current
                  - totalOfPages
                properties:
                  current:
                    type: number
                    description: 'Current requested page, Otherwise the first page (1).'
                  totalOfPages:
                    type: number
                    description: 'Total of pages available, given the total of Records divide by page size (Default 50)'
            required:
              - brands
              - page
          examples:
            Success Response - Payload Example:
              value:
                brands:
                  - code: 1127718
                    name: Samsung
                  - code: 1128070
                    name: AIC APPLICATION
                page:
                  current: 1
                  totalOfPages: 3100
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/catalog@brands.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/catalog@brands.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/catalog@brands.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/catalog@brands.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/catalog@brands.php'      
