get:
  tags:
    - Catalog
  summary: Retrieve Stocks
  description: |-
    Get Stock paginated.


    **Paginated:** Yes, by "Next token" approach (same as GOP "Get Orders" API).
  operationId: get-catalog-stock
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
    - in: query
      name: token
      schema:
        type: string
    - in: query
      name: size
      schema:
        type: integer
        format: x64
        default: 10
      description: The number of desired records between 1 and 100.
    - in: query
      name: productSids
      schema:
        type: array
        items:
          type: string
      description: Product sids to filter in
  responses:
    '200':
      description: OK. The request was successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              products:
                type: array
                description: List of products.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Product Sid.
                    sellerSku:
                      type: string
                      description: Product Seller SKU.
                    globalStock:
                      type: number
                      description: Global stock for the product
                    lastStockUpdatedAt:
                      type: string
                      format: date-time
                      description: Last update done by the seller to this product's stock
                  required:
                    - id
                    - sellerSku
                    - globalStock
                    - lastStockUpdatedAt
              nextToken:
                type: string
                description: Pagination token.
              isLastPage:
                type: boolean
                description: Indicates if there are more pages to iterate
            required:
              - products
          examples:
            Success Response - Payload Example:
              value:
                products:
                  - id: 07c390ae-d58a-42a2-8ec6-5051bca18cab
                    sellerSku: '8682447314708'
                    globalStock: 100
                    lastStockUpdatedAt: '2020-05-28T19:37:03Z'
                nextToken: n1b6an-TQiCuu1V-9MYPJNpW_qKq_GM0a2r8KLlbw5cVkJDZ9O_nsf_E6IrvCI5C
                isLastPage: false
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/catalog@stock.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/catalog@stock.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/catalog@stock.java'      
    - lang: 'go'
      source:  
        $ref: '../../code-samples/go/catalog@stock.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/catalog@stock.php'      