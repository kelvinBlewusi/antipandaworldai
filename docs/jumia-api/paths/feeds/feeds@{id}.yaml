parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: ID of the feed.
get:
  tags:
    - Products
  summary: Retrieve Product Details
  description: |-
    Request Product details.

    **Limit of Records:** We should start with a limit of 1000 records because of the payload Size.

    > ***_NOTE:_*** The `productSid` will not be returned when the feed was a product creation.

    To perform an update of newly created products, you need to get the products data at least once, from which you will get 2 valuable information for you to proceed:
    
    * (1) The `productSid` needed for the update. 
    * (2) the QC status `status` i.e if your product is compliant with our listing guideline and can be sold on the platform.

    This gives you detail on the countries (businessClients) your product was created and if it was QC approved, you can only update the stock, price, status of products that have QC status `status` approved at least once. So alongside storing the `productSid`, you need to store the `status` and only send the updates for those whose value is approved.

    Important to create products aiming for a high content score: [check the guide.](https://contentguidelines.jumia.com.ng/2018/08/06/introduction-to-content-score/)
  
    **List of Feed Status**

    | Status |
    | --- |
    | FAILED |
    | COMPLETED |
    | IN_PROGRESS |
    | PENDING |

    **List of Feed Types**

    | Types |
    | --- |
    | PRODUCT_CREATION |
    | PRODUCT_UPDATE |
    | PRODUCT_STATUS_UPDATE |
    | STOCK_UPDATE |
    | PRICE_UPDATE |
    | PRODUCT_SET_QC_STATUS_UPDATE |
  operationId: get-feeds-id
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  responses:
    '200':
      description: OK. The feed details by ID.
      content:
        application/json:
          schema:
            type: object
            properties:
              feedSid:
                type: string
                format: uuid
                description: SKU of the feed.
              status:
                type: string
                description: 'Status of the performed action (FAILED, COMPLETED,...)'
              feedType:
                type: string
                description: 'Type of action performed (PRODUCT_CREATION, PRODUCT_UPDATE,...)'
              feedSource:
                type: string
                description: Attribute Description.
              reportUrl:
                type: string
                description: URL of the report.
              errorMessage:
                type: string
                description: Error message.
              total:
                type: number
                description: Total number of times the action was executed.
              completed:
                type: number
                description: Number of times the action was completed.
              failed:
                type: number
                description: Number of times the action failed.
              createdBy:
                type: object
                required:
                  - sid
                  - name
                  - email
                properties:
                  sid:
                    type: string
                    format: uuid
                    description: Sid of the person who performed the action.
                  name:
                    type: string
                    description: Name of the person who performed the action.
                  email:
                    type: string
                    description: Email of the person who performed the action.
              feedItems:
                type: array
                description: Feed items details of this feed
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      description: 'Status of the performed action (FAILED, COMPLETED,...)'
                    productSid:
                      type: string
                      format: uuid
                      description: Sid of the product sent on the feed. Ignore this field if the feedType is PRODUCT_CREATION.
                    sellerSKU:
                      type: string
                      description: Seller sku of the product send on the feed
                    errorMessage:
                      type: string
                    errors:
                      type: object
                      properties:
                        globalMessages:
                          type: array
                          description: List of global messages
                          items:
                            type: string
                        businessClients:
                          type: object
                          description: Business Client list
                          required:
                            - code
                            - messages
                          properties:
                            code:
                              type: string
                              description: Business Client code
                            messages:
                              type: array
                              description: Business Client code specific message
                              items:
                                type: string
                      required:
                        - globalMessages
                        - businessClients
                    createdAt:
                      type: string
                      format: date-time
                      description: Creation date
                    updatedAt:
                      type: string
                      format: date-time
                      description: Last upated date
                  required:
                    - status
                    - productSid
                    - sellerSKU
                    - createdAt
                    - updatedAt
            required:
              - feedSid
              - status
              - feedType
              - feedSource
              - total
              - completed
              - failed
              - createdBy
          examples:
            Response - Payload Example:
              value:
                feedSid: fb53ce1d-6268-4f4f-948e-e880bcdeacea
                status: COMPLETED
                feedType: PRODUCT_UPDATE
                feedSource: CSV
                total: 1
                completed: 1
                failed: 0
                createdBy:
                  sid: cef73249-0ee0-3c6e-943e-d896554e6242
                  name: Giane Fernandes
                  email: giane.fernandes@jumia.com
                feedItems:
                  - status: COMPLETED
                    productSid: 13192a6d-cd11-4a75-b944-ee7bbb530d86
                    sellerSKU: Firebolt-sku-10
                    createdAt: '2020-11-03T11:23:13.406412Z'
                    updatedAt: '2020-11-03T11:23:15.723854Z'
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source: 
        $ref: '../../code-samples/curl/feeds@{id}.txt'      
    - lang: 'python'
      source: 
        $ref: '../../code-samples/python/feeds@{id}.py'      
    - lang: 'java'
      source: 
        $ref: '../../code-samples/java/feeds@{id}.java'      
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/feeds@{id}.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/feeds@{id}.php'      
