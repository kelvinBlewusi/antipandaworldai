post:
  tags:
  - Products
  summary: Create Products
  description: |-
    Request a new Feed of Products creation.

    **Limit of Records:** We should start with a limit of 1000 records because of the payload Size.

    > ***_NOTE:_*** Please study the general content [guideline](https://guidescontentjumiang.wordpress.com/) before creating your products.
  operationId: post-feeds-products-create
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            shopId:
              type: string
              format: uuid
              description: Shop Id.
            products:
              type: array
              description: List of Products to be created.
              items:
                type: object
                properties:
                  name:
                    type: object
                    required:
                      - value
                    properties:
                      value:
                        type: string
                        description: |
                          Name of the product in default English language. For a better listing quality, the name should consist the actual product name, if available colour, edition, speciality.
                      translations:
                        type: array
                        description: List of translations for name.
                        items:
                          type: object
                          properties:
                            language:
                              type: string
                              description: Translation language for name.
                            value:
                              type: string
                              description: Name of the product in the selected language.
                  description:
                    type: object
                    required:
                      - value
                    properties:
                      value:
                        type: string
                        description: 'Description of the product in default English language, it should give the customer useful information about the product to ensure a purchase. Check [this page](http://bit.ly/3aazgoU) for more information.'
                      translations:
                        type: array
                        description: List of translations for description.
                        items:
                          type: object
                          properties:
                            language:
                              type: string
                              description: Translation language for the description.
                            value:
                              type: string
                              description: Description of the product in the selected language.
                  parentSku:
                    type: string
                    description: |-
                      Parent SKU is used to group variations (e.g. different sizes) of a product together, fill this field with the SellerSKU of the first product. Products with the same parent SKU should pass the same set of product images.
                      
                      Example on how to add a new variation:

                      | Product | Request Payload | Description |
                      | --- | --- | --- |
                      | 1st Product | `"parentSku":"new_product_sku_60077999"`<br>`"sellerSku":"new_product_sku_60077999"`<br>`"variation":"1"` | First variation will be the parent. |
                      | 2nd Product | `"parentSku":"new_product_sku_60077999"`<br>`"sellerSku":"new_product_sku_60078000"`<br>`"variation":"2"` | On the next variation, the parent SKU will be the one from first variation. The variation and the seller SKU needs to be different. |

                  sellerSku:
                    type: string
                    description: 'Seller SKU is the identifier of the product, provided by the Seller.'
                  gtinBarcode:
                    type: string
                    description: 'GTIN Barcode of the product, provided by the Seller.'
                  variation:
                    type: string
                    description: Value that define the Product variation at the same Product Set. Each Attribute set can have only one simple attribute that is the variation.
                  brand:
                    type: object
                    required:
                      - code
                      - name
                    properties:
                      code:
                        type: number
                        description: 'Brand of the product. If brand does not exist, fill this [form](https://goo.gl/Hw8vma) accordingly. For unbranded Fashion items, please use code "1039426" and name "Fashion". Other unbranded items, please use code "1045133" and name "Generic".'
                      name:
                        type: string
                        description: The name of the brand.
                  category:
                    type: object
                    required:
                      - code
                      - name
                    properties:
                      code:
                        type: number
                        description: The primary category determines that the right product attributes are set for the product.
                      name:
                        type: string
                        description: The name of the category.
                  additionalCategories:
                    type: array
                    description: Deprecated
                    deprecated: true
                    items:
                      type: object
                      deprecated: true
                      properties:
                        code:
                          type: number
                          description: Deprecated
                          deprecated: true
                        name:
                          type: string
                          description: Deprecated
                          deprecated: true
                  images:
                    type: array
                    description: List of the Product images. At least one Primary image is required. Products with the same parent SKU should pass the same set of product images.
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Image Public URL.
                          format: uri
                        primary:
                          type: boolean
                          description: 'True if the primary, otherwise false. Only one image is allowed to be primary.'
                      required:
                        - url
                        - primary
                  price:
                    type: object
                    required:
                      - value
                    properties:
                      currency:
                        type: string
                        description: Price currency. (If empty USD is assumed by default)
                      value:
                        type: number
                        description: 'This is the price that the customer has to pay for the product in the refereed currency. This price includes taxes. '
                      salePrice:
                        type: object
                        description: 'If sale price value is present, then StartAt and EndAt are required.'
                        properties:
                          value:
                            type: number
                            description: Sales Price for a Product in the refereed currency.
                          startAt:
                            type: string
                            format: date
                            description: 'Sales Price start date. Date format is YYYY-MM-DD hh24:mm. The first minute/second of the day in the Country local time zone. 00:00:00'
                          endAt:
                            type: string
                            format: date
                            description: 'Sales Price end date. Date format YYYY-MM-DD hh24:mm. The last minute/second of the day in the Country local time zone. 23:59:59'
                  businessClients:
                    type: array
                    description: List of Business Clients. Required for global seller in local currency mode.
                    items:
                      type: object
                      properties:
                        businessClientCode:
                          type: string
                          description: Code of Business Client
                        price:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: Price currency, must be the same as currency of the business client.
                            value:
                              type: number
                              description: Price in refereed currency
                            salePrice:
                              type: object
                              nullable: true
                              properties:
                                value:
                                  type: number
                                  description: Sale price in refereed currency
                                  nullable: true
                                startAt:
                                  type: string
                                  format: date
                                  description: 'Sale Start date YYYY-MM-DD hh24:mm'
                                  nullable: true
                                endAt:
                                  type: string
                                  format: date
                                  description: 'Sale End date YYYY-MM-DD hh24:mm'
                                  nullable: true
                  stock:
                    type: number
                    description: Enter the quantity/stock for the product.
                  attributes:
                    type: array
                    description: |-
                      It depends if attribute is required or not. Need to be checked for each attribute on attribute set entry point.

                      Due to some legacy configuration, if name / description / variation (or an attribute marked with "variation": true) shows in an attribute set, it will be taken in with higher priority compared to the common attribute of the same name (name / description / variation) at product level. Please apply the same value for both.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the attribute.
                        value:
                          type: string
                          description: 'Attribute value. If type Text, should be in in the default English language. For other types like Number and boolean, also should be sent as String to preserve a generic JSON data type. e.g. "true", "123.44"'
                        translations:
                          type: array
                          description: List of translations for the attribute.
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                description: Translation language for the attribute.
                              value:
                                type: string
                                description: Name of the attribute in the selected language.
                      required:
                        - name
                        - value
                required:
                  - name
                  - description
                  - parentSku
                  - sellerSku
                  - variation
                  - brand
                  - category
                  - images
                  - price
                  - stock
                  - attributes
          required:
            - shopId
            - products
        examples:
          Request - Payload Example:
            value:
              shopId: a8b5534b-277b-449c-97b7-c00979dd9c3a
              products:
                - name:
                    value: Name should be between 15 and 60 characters
                    translations:
                      - language: AR
                        value: اختبار اسم المنتج
                      - language: FR
                        value: Test du nom du produit
                  description:
                    value: 'Description should have more than 150 words. Product number35G41EAProduct nameHP Spectre x360 Convertible 14-ea0047naMicroprocessorIntel® Core™ i5-1135G7 (up to 4.2 GHz with Intel® Turbo Boost Technology, 8 MB L3 cache, 4 cores)ChipsetIntel® Integrated SoCMemory, standard8 GB LPDDR4x-3733 MHz RAM (onboard)Video graphicsIntel® Iris® Xᵉ GraphicsHard drive512 GB PCIe® NVMe™ TLC M.2 SSDOptical driveOptical drive not includedDisplay34.3 cm (13.5) diagonal, WUXGA+ (1920 x 1280), multitouch-enabled, IPS, edge-to-edge glass, micro-edge, Corning® Gorilla® Glass NBT™, 1000 nits, 100% sRGB, HP Sure View Reflect integrated privacy screenWireless connectivityIntel® Wi-Fi 6 AX201 (2x2) and Bluetooth® 5 combo (Supporting Gigabit file transfer speeds)Expansion slots1 microSD media card readerExternal ports2 Thunderbolt™ 4 with USB4™ Type-C® 40Gbps signaling rate (USB Power Delivery, DisplayPort™ 1.4, HP Sleep and Charge); 1 SuperSpeed USB Type-A 10Gbps signaling rate (HP Sleep and Charge); 1 headphone/microphone comboMinimum dimensions (W x D x H)29.83 x 22.01 x 1.69 cmWeight1.34 kgPower supply type65 W USB Type-C® power adapterBattery type4-cell, 66 Wh Li-ion polymerBattery life mixed usageUp to 15 hours and 45 minutesVideo Playback Battery lifeUp to 16 hours and 30 minutesWebcamHP True Vision 720p HD IR camera with camera shutter and integrated dual array digital microphonesAudio featuresAudio by Bang & Olufsen; Quad speakers; HP Audio BoostSoftwareOperating systemWindows 10 Home 64HP appsHP 3D DriveGuard; HP Audio Switch; HP JumpStart; HP Support AssistantSoftware includedMcAfee LiveSafe™Pre-installed softwareExpressVPN (30 day free trial); LastPass Premium (30 day free trial).'
                    translations:
                      - language: AR
                        value: اختبار اسم المنتج
                      - language: FR
                        value: Test du description du produit
                  parentSku: new_product_sku_60077999
                  sellerSku: new_product_sku_60077999
                  gtinBarcode: '000123456001234570'
                  variation: '1'
                  brand:
                    code: 1126253
                    name: 123 updated
                  category:
                    code: 1004141
                    name: Gaming / PC Gaming / Accessories / Controllers
                  images:
                    - url: 'https://ng.jumia.is/LgDWyaUAUqlaDlr6gmf0ui43GGk=/fit-in/500x500/filters:fill(white)/product/90/278208/1.jpg?4790'
                      primary: true
                    - url: 'https://ng.jumia.is/W-t47t1CIN1cl_y6KcnaM5Z-PjM=/fit-in/500x500/filters:fill(white)/product/90/278208/2.jpg?4790'
                      primary: false
                  price:
                    currency: USD
                    value: 200
                    salePrice:
                      value: 150
                      startAt: '2022-08-11'
                      endAt: '2022-08-22'
                  businessClients:
                    - businessClientCode: jumia-ma
                      price:
                        currency: MAD
                        value: 20000
                        salePrice:
                          value: 15000
                          startAt: '2022-08-11'
                          endAt: '2022-08-22'
                    - businessClientCode: jumia-eg
                      price:
                        currency: EGP
                        value: 22000
                        salePrice:
                          value: 18000
                          startAt: '2022-08-12'
                          endAt: '2022-08-23'
                  stock: 500
                  attributes:
                    - name: isbn
                      value: 0-6280-1750-2
                    - name: note
                      value: note about the product
                    - name: plug_type
                      value: EU
                    - name: voltage
                      value: '100'
                    - name: connection_gender
                      value: gender of the connection
                    - name: battery_capacity
                      value: 100 mAh
                    - name: model
                      value: product model
                      translations:
                        - language: AR
                          value: محتوى العبوة عربي
                        - language: FR
                          value: Produit model
                    - name: short_description
                      value: <ul><li>short description should have at least 4 bullets</li><li>short description </li><li>short description </li><li>short description </li></ul>
                    - name: color_family
                      value: Black
                    - name: color
                      value: Black
                    - name: warranty_duration
                      value: '10'
    description: ''
  responses:
    '201':
      description: Created. The feed was successfully created
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
            properties:
              feedId:
                type: string
                format: uuid
                description: The Feed Id.
            required:
              - feedId
          examples:
            Response - Payload Example:
              value:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
