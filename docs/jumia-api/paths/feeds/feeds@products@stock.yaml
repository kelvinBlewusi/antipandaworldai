post:
  tags:
  - Products
  summary: Update Product Stock
  description: |-
    Request a new Feed of Products stock update.

    **Limit of Records:** We should start with a limit of 1000 records because of the payload Size.
  operationId: post-feeds-products-stock
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            products:
              type: array
              description: List of Products to have the stock updated.
              items:
                type: object
                properties:
                  sellerSku:
                    type: string
                    description: Seller SKU.
                  id:
                    type: string
                    format: uuid
                    description: Product SID.
                  stock:
                    type: number
                    description: Stock of the product.
                required:
                  - sellerSku
                  - id
                  - stock
          required:
            - products
        examples:
          Request - Payload Example:
            value:
              products:
                - sellerSku: '8682447314708'
                  id: 07c390ae-d58a-42a2-8ec6-5051bca18cab
                  stock: 100
                - sellerSku: '8682447314709'
                  id: 07c390ae-d58a-42a2-8ec6-5051bca19cab
                  stock: 50
  responses:
    '201':
      description: Created. The feed was successfully created
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
            properties:
              feedId:
                type: string
                format: uuid
                description: The Feed Id.
            required:
              - feedId
          examples:
            Success response - Payload Example:
              value:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
        application/xml:
          schema:
            type: object
            properties: {}
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
    - lang: 'curl'
      source:
        $ref: '../../code-samples/curl/feeds@products@stock.txt'      
    - lang: 'python'
      source:
        $ref: '../../code-samples/python/feeds@products@stock.py'       
    - lang: 'java'
      source:
        $ref: '../../code-samples/java/feeds@products@stock.java'       
    - lang: 'go'
      source: 
        $ref: '../../code-samples/go/feeds@products@stock.go'      
    - lang: 'php'
      source: 
        $ref: '../../code-samples/php/feeds@products@stock.php'      
