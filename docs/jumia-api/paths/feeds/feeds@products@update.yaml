post:
  tags:
  - Products
  summary: Update Products
  description: |-
    Request a new Feed of Products update.

    **Limit of Records:** We should start with a limit of 1000 records because of the payload Size.

    **Product Set Level - Data Section**

    | Data Sections | Allow Update |
    | --- | --- |
    | Additional Category | YES |
    | Brand | YES |
    | Config Attributes List | YES |
    | Images (Main Image) | NO |
    | Main Category | NO |
    | Parent SKU | NO |

    **Product Level / Product Variation Level - Data Section**

    | Data Sections | Allow Update |
    | --- | --- |
    | GTIN Barcode | YES |
    | Global Price / Sale Price | NO |
    | Initial Stock | NO |
    | Simple Attribute List | YES |
    | Variation | YES |
  operationId: post-feeds-products-update
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          description: Shop Id.
          properties:
            shopId:
              type: string
              format: uuid
            products:
              type: array
              description: List of Products to be created.
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Product SKU.
                  name:
                    type: object
                    required:
                      - value
                    properties:
                      value:
                        type: string
                        description: Product name in the default English language.
                      translations:
                        type: array
                        items:
                          type: object
                          properties:
                            language:
                              type: string
                              description: FR to French or AR to Arabic
                            value:
                              type: string
                              description: Product name in the target language
                  description:
                    type: object
                    required:
                      - value
                    properties:
                      value:
                        type: string
                        description: Product description in the default English language.
                      translations:
                        type: array
                        items:
                          type: object
                          properties:
                            language:
                              type: string
                              description: FR to French or AR to Arabic
                            value:
                              type: string
                              description: Product description in the target language
                  parentSku:
                    type: string
                    description: Parent SKU is used to group variations of the same Product Set.
                  sellerSku:
                    type: string
                    description: Seller SKU
                  gtinBarcode:
                    type: string
                    description: GTIN Barcode
                  variation:
                    type: string
                    description: Value that define the Product variation at the same Product Set. 
                  brand:
                    type: object
                    required:
                      - code
                      - name
                    properties:
                      code:
                        type: number
                        description: Brand Code.
                      name:
                        type: string
                        description: Brand Name.
                  category:
                    type: object
                    required:
                      - code
                      - name
                    properties:
                      code:
                        type: number
                        description: Brand Code.
                      name:
                        type: string
                        description: Brand Name.
                  additionalCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: number
                          description: Additional Category Code.
                        name:
                          type: string
                          description: Additional Category Name.
                  images:
                    type: array
                    description: At least one Primary image is required.
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Image Public URL.
                          format: uri
                        primary:
                          type: boolean
                          description: 'True if the primary, otherwise false. Only one image is allowed to be primary.'
                      required:
                        - url
                        - primary
                  price:
                    type: object
                    properties:
                      value:
                        type: number
                      salePrice:
                        type: object
                        properties:
                          value:
                            type: number
                          startAt:
                            type: string
                            description: 'Sale Start date YYYY-MM-DD hh24:mm'
                          endAt:
                            type: string
                            description: 'Sale End date YYYY-MM-DD hh24:mm'
                  stock:
                    type: integer
                  attributes:
                    type: array
                    description: It depends of attribute can be required or not. Need to be checked each attribute on attribute set entry point.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Attribute name.
                        value:
                          type: string
                          description: |-
                            Attribute value. If type Text, should be in in the default English language.
                            For other types like Number and boolean, also should be sent as String to preserve a generic JSON data type. e.g. "true", "123.44"
                        translations:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                description: FR to French or AR to Arabic
                              value:
                                type: string
                                description: Product name in the target language
                      required:
                        - name
                        - value
                required:
                  - id
                  - name
                  - description
                  - parentSku
                  - sellerSku
                  - brand
                  - category
                  - images
                  - attributes
          required:
            - products
        examples:
