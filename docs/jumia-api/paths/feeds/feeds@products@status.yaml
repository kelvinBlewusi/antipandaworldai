post:
  tags:
  - Products
  summary: Update Product Status
  description: |-
    Request a new Feed of Products status update.

    **Limit of Records:** We should start with a limit of 1000 records because of the payload Size.
  operationId: post-feeds-products-status
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: JWT Token generated by Keycloak and Application ID
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            products:
              type: array
              description: List of Products to have the price updated.
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Product SID.
                  sellerSku:
                    type: string
                    description: Seller SKU.
                  createdAt:
                    type: string
                    description: Date when the product was created.
                    format: date
                  businessClients:
                    type: array
                    description: List of Business Clients.
                    items:
                      type: object
                      properties:
                        businessClientCode:
                          type: string
                          description: Code of the Business Client
                        status:
                          type: string
                          description: Status of the product.
                      required:
                        - businessClientCode
                        - status
                required:
                  - id
                  - sellerSku
                  - businessClients
          required:
            - products
        examples:
          Request - Payload Example:
            value:
              products:
                - sellerSku: '8682447314708'
                  id: 07c390ae-d58a-42a2-8ec6-5051bca18cab
                  createdAt: '2021-08-11'
                  businessClients:
                    - businessClientCode: jumia-ma
                      status: ACTIVE
                    - businessClientCode: jumia-dz
                      status: INACTIVE
  responses:
    '201':
      description: Created. The feed was successfully created
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
            properties:
              feedId:
                type: string
                format: uuid
                description: The feed Id
            required:
              - feedId
          examples:
            Response - Payload Example:
              value:
                feedId: 07c390ae-d58a-42a2-8ec6-5051bca19cab
    '400':
      $ref: '../../components/responses/gpm-api/error400.yaml'
    '401':
      $ref: '../../components/responses/gpm-api/error401.yaml'
    '403':
      $ref: '../../components/responses/gpm-api/error403.yaml'
    '404':
      $ref: '../../components/responses/gpm-api/error404.yaml'
    '405':
      $ref: '../../components/responses/gpm-api/error405.yaml'
    '500':
      $ref: '../../components/responses/gpm-api/error500.yaml'
    '501':
      $ref: '../../components/responses/gpm-api/error501.yaml'
  x-codeSamples:
  - lang: 'curl'
    source: 
      $ref: '../../code-samples/curl/feeds@products@status.txt'      
  - lang: 'python'
    source: 
      $ref: '../../code-samples/python/feeds@products@status.py'      
  - lang: 'java'
    source: 
      $ref: '../../code-samples/java/feeds@products@status.java'      
  - lang: 'go'
    source: 
      $ref: '../../code-samples/go/feeds@products@status.go'      
  - lang: 'php'
    source: 
      $ref: '../../code-samples/php/feeds@products@status.php'      
